<script type="text/plain" id="src-dijkstra">import java.util.*;

public class Dijkstra {

    static class Edge {
        int to, w;
        Edge(int to, int w) { this.to = to; this.w = w; }
    }

    static int[] shortestPaths(List<List<Edge>> graph, int src) {
        int n = graph.size();
        int[] dist = new int[n];
        Arrays.fill(dist, Integer.MAX_VALUE);
        dist[src] = 0;

        // each entry is {node, distance}, smallest distance first
        PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> Integer.compare(a[1], b[1]));
        pq.offer(new int[]{src, 0});

        while (!pq.isEmpty()) {
            int[] cur = pq.poll();
            int u = cur[0], d = cur[1];

            if (d > dist[u]) continue;   // stale entry, a shorter path was already found

            for (Edge e : graph.get(u)) {
                int nd = d + e.w;
                if (nd < dist[e.to]) {
                    dist[e.to] = nd;
                    pq.offer(new int[]{e.to, nd});
                }
            }
        }
        return dist;
    }

    static void addEdge(List<List<Edge>> g, int a, int b, int w) {
        g.get(a).add(new Edge(b, w));
        g.get(b).add(new Edge(a, w));   // remove this line for a directed graph
    }

    public static void main(String[] args) {
        int n = 5;
        List<List<Edge>> g = new ArrayList<>();
        for (int i = 0; i < n; i++) g.add(new ArrayList<>());

        addEdge(g, 0, 1, 4);
        addEdge(g, 0, 2, 1);
        addEdge(g, 2, 1, 2);
        addEdge(g, 1, 3, 1);
        addEdge(g, 2, 3, 5);
        addEdge(g, 3, 4, 3);

        int[] dist = shortestPaths(g, 0);
        for (int i = 0; i < n; i++) {
            System.out.println("0 -> " + i + " = " + dist[i]);
        }
    }
}</script>
